name: VibeBridge Mac runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Predefined task to run on the trusted Mac runner"
        required: true
        type: choice
        default: test
        options:
          - validate
          - test
          - diagnostics
          - terminal-smoke

permissions:
  contents: read

concurrency:
  group: vibebridge-mac-runner
  cancel-in-progress: false

jobs:
  run-on-mac:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    env:
      TASK: ${{ inputs.task || 'test' }}
    steps:
      - name: Verify checkout
        uses: actions/checkout@v4

      - name: Record runner details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-results
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "host=$(scutil --get ComputerName 2>/dev/null || hostname)"
            echo "macOS=$(sw_vers -productVersion)"
            echo "python=$(python3 --version 2>&1)"
            echo "node=$(node --version 2>&1 || true)"
            echo "git=$(git rev-parse --short HEAD)"
            echo "task=$TASK"
          } | tee runner-results/runner-info.txt

      - name: Validate source
        if: env.TASK == 'validate' || env.TASK == 'test'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent/server.py agent/updater.py
          python3 -m json.tool extension/manifest.json >/dev/null
          bash -n agent/install.sh
          bash -n "packaging/Install VibeBridge.command"
          bash -n "packaging/Authenticate GitHub.command"
          node --check extension/background.js
          node --check extension/chatgpt.js
          node --check extension/popup.js
          echo "Source validation passed." | tee runner-results/validation.txt

      - name: Run unit tests
        if: env.TASK == 'test'
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee runner-results/unit-tests.txt
          node tests/test_extension_bridge.js 2>&1 | tee runner-results/extension-bridge-tests.txt
          node tests/test_chatgpt_content_script.js 2>&1 | tee runner-results/content-script-tests.txt

      - name: Verify authenticated local command round-trip
        if: env.TASK == 'terminal-smoke'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$HOME/Library/Application Support/VibeBridge/token"
          test -f "$TOKEN_FILE" || { echo "VibeBridge token file missing."; exit 1; }
          python3 - <<'PY' | tee runner-results/terminal-smoke.txt
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token_file = Path.home() / "Library/Application Support/VibeBridge/token"
          token = token_file.read_text(encoding="utf-8").strip()
          payload = json.dumps({
              "project": str(Path.home() / "VibeBridge"),
              "command": ["python3", "-c", "print('VibeBridge terminal relay OK')"]
          }).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:43127/run",
              data=payload,
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  result = json.loads(response.read().decode())
          except Exception as exc:
              raise SystemExit("Authenticated /run request failed: " + str(exc))
          print(json.dumps({key: result.get(key) for key in ("project", "exitCode", "stdout", "stderr")}, indent=2))
          if result.get("exitCode") != 0 or "VibeBridge terminal relay OK" not in result.get("stdout", ""):
              raise SystemExit("Terminal relay smoke test failed.")
          print("PASS: authenticated local command round-trip")
          PY

      - name: Capture local-agent diagnostics
        if: env.TASK == 'diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== Agent process =="
            launchctl print "gui/$(id -u)/com.vibebridge.agent" 2>&1 || true
            echo
            echo "== Updater process =="
            launchctl print "gui/$(id -u)/com.vibebridge.updater" 2>&1 || true
            echo
            echo "== Health endpoint =="
            TOKEN_FILE="$HOME/Library/Application Support/VibeBridge/token"
            if [ -f "$TOKEN_FILE" ]; then
              curl --silent --show-error --max-time 5 \
                -H "Authorization: Bearer $(cat "$TOKEN_FILE")" \
                http://127.0.0.1:43127/health || true
            else
              echo "Token file missing."
            fi
            echo
            echo "== Recent agent log =="
            tail -n 120 "$HOME/Library/Application Support/VibeBridge/agent-error.log" 2>/dev/null || true
            echo
            echo "== Recent updater log =="
            tail -n 120 "$HOME/Library/Application Support/VibeBridge/updater-error.log" 2>/dev/null || true
          } | tee runner-results/diagnostics.txt

      - name: Upload Mac-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibebridge-mac-${{ env.TASK }}-${{ github.run_id }}
          path: runner-results/
          if-no-files-found: warn
          retention-days: 7
