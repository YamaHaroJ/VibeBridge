name: VibeBridge Mac runner

on:
  push:
    branches: [master]
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      task:
        description: "Predefined task to run on the trusted Mac runner"
        required: true
        type: choice
        default: test
        options:
          - validate
          - test
          - diagnostics

permissions:
  contents: read
  issues: write

concurrency:
  group: vibebridge-mac-runner
  cancel-in-progress: false

jobs:
  run-on-mac:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    env:
      TASK: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, 'VibeBridge task: ') && github.event.issue.title || inputs.task || 'test' }}
    steps:
      - name: Ignore unrelated issues
        if: github.event_name == 'issues' && !startsWith(github.event.issue.title, 'VibeBridge task: ')
        run: exit 0

      - name: Normalize issue task title
        if: github.event_name == 'issues'
        shell: bash
        run: |
          case "$TASK" in
            "VibeBridge task: diagnostics") echo "TASK=diagnostics" >> "$GITHUB_ENV" ;;
            "VibeBridge task: test") echo "TASK=test" >> "$GITHUB_ENV" ;;
            "VibeBridge task: validate") echo "TASK=validate" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported VibeBridge task title: $TASK"; exit 1 ;;
          esac

      - name: Verify checkout
        uses: actions/checkout@v4

      - name: Record runner details
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runner-results
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "host=$(scutil --get ComputerName 2>/dev/null || hostname)"
            echo "macOS=$(sw_vers -productVersion)"
            echo "python=$(python3 --version 2>&1)"
            echo "node=$(node --version 2>&1 || true)"
            echo "git=$(git rev-parse --short HEAD)"
            echo "task=$TASK"
          } | tee runner-results/runner-info.txt

      - name: Validate source
        if: env.TASK == 'validate' || env.TASK == 'test'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent/server.py agent/updater.py
          python3 -m json.tool extension/manifest.json >/dev/null
          bash -n agent/install.sh
          bash -n "packaging/Install VibeBridge.command"
          bash -n "packaging/Authenticate GitHub.command"
          node --check extension/background.js
          node --check extension/chatgpt.js
          node --check extension/popup.js
          echo "Source validation passed." | tee runner-results/validation.txt

      - name: Run unit tests
        if: env.TASK == 'test'
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee runner-results/unit-tests.txt

      - name: Capture local-agent diagnostics
        if: env.TASK == 'diagnostics'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "== Agent process =="
            launchctl print "gui/$(id -u)/com.vibebridge.agent" 2>&1 || true
            echo
            echo "== Updater process =="
            launchctl print "gui/$(id -u)/com.vibebridge.updater" 2>&1 || true
            echo
            echo "== Health endpoint =="
            TOKEN_FILE="$HOME/Library/Application Support/VibeBridge/token"
            if [ -f "$TOKEN_FILE" ]; then
              curl --silent --show-error --max-time 5 \
                -H "Authorization: Bearer $(cat "$TOKEN_FILE")" \
                http://127.0.0.1:43127/health || true
            else
              echo "Token file missing."
            fi
            echo
            echo "== Recent agent log =="
            tail -n 120 "$HOME/Library/Application Support/VibeBridge/agent-error.log" 2>/dev/null || true
            echo
            echo "== Recent updater log =="
            tail -n 120 "$HOME/Library/Application Support/VibeBridge/updater-error.log" 2>/dev/null || true
          } | tee runner-results/diagnostics.txt

      - name: Post Mac result to task issue
        if: always() && github.event_name == 'issues' && startsWith(github.event.issue.title, 'VibeBridge task: ')
        uses: actions/github-script@v7
        env:
          TASK: ${{ env.TASK }}
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome = job.status === "success" ? "PASS" : "FAIL";
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `**VibeBridge Mac diagnostics — ${outcome}**\n\nTask: ${process.env.TASK}\nRunner: ${process.env.RUNNER_NAME || "self-hosted macOS"}\n[Workflow logs](${runUrl})\n\nThe attached artifact contains the local process and log snapshot when diagnostics was requested.`
            });

      - name: Upload Mac-run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibebridge-mac-${{ env.TASK }}-${{ github.run_id }}
          path: runner-results/
          if-no-files-found: warn
          retention-days: 7
