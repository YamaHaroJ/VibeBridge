<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VibeBridge</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --ink: #171923;
      --muted: #707786;
      --line: #e5e7eb;
      --accent: #6759e8;
      --accent-soft: #eeecff;
      --ok: #17845b;
      --warn: #a56a12;
      --shadow: 0 12px 34px rgba(26, 30, 50, .09);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111217;
        --surface: #1a1c23;
        --ink: #f5f6fa;
        --muted: #a1a6b4;
        --line: #30333d;
        --accent: #a69cff;
        --accent-soft: #2b2747;
        --ok: #5bd6a2;
        --warn: #f0c36c;
        --shadow: 0 12px 34px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--ink);
      font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      border-radius: 11px; background: var(--accent-soft); color: var(--accent);
      font-size: 17px; font-weight: 800; letter-spacing: -1px;
    }
    h1 { margin: 0; font-size: 16px; letter-spacing: -.35px; font-weight: 750; }
    .tagline { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .panel {
      padding: 17px 15px 14px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 17px; box-shadow: var(--shadow);
    }
    .state-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .state-title { font-size: 14px; font-weight: 700; }
    .state-copy { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .switch {
      position: relative; flex: 0 0 auto; width: 46px; height: 27px;
      border: 0; padding: 0; border-radius: 999px; cursor: pointer;
      background: #c9cbd3; transition: background .18s ease, opacity .18s ease;
    }
    .switch::after {
      content: ""; position: absolute; width: 21px; height: 21px;
      left: 3px; top: 3px; border-radius: 50%; background: white;
      box-shadow: 0 1px 4px #0002; transition: transform .18s ease;
    }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(19px); }
    .switch:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .switch:disabled { opacity: .38; cursor: not-allowed; }
    .status {
      display: flex; align-items: center; gap: 8px; margin-top: 17px;
      padding-top: 13px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 11px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #a5a8b2; flex: 0 0 auto; }
    .status[data-state="ready"] .dot { background: var(--ok); }
    .status[data-state="setup"] .dot { background: var(--warn); }
    .footer { text-align: center; margin: 12px 0 0; color: var(--muted); font-size: 10px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="mark" aria-hidden="true">V</div>
    <div>
      <h1>VibeBridge</h1>
      <p class="tagline">Your projects, in context.</p>
    </div>
  </header>
  <main class="panel">
    <div class="state-row">
      <div>
        <div class="state-title" id="state-title">Checking setup</div>
        <div class="state-copy" id="state-copy">Connecting to your local agent…</div>
      </div>
      <button class="switch" id="enabled" type="button" role="switch" aria-checked="false" aria-label="Turn VibeBridge on or off" disabled></button>
    </div>
    <div class="status" id="status" data-state="checking" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Checking local connection</span>
    </div>
  </main>
  <p class="footer">Automatic project context for ChatGPT</p>
  <script src="popup.js"></script>
</body>
</html>
