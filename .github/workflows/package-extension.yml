name: Package Chrome Extension

on:
  workflow_dispatch:
  push:
    paths:
      - "extension/**"
      - ".github/workflows/package-extension.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package extension
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from zipfile import ZipFile
          source = Path("extension")
          output = Path("web-store-package")
          shutil.copytree(source, output, ignore=shutil.ignore_patterns(".DS_Store", "__MACOSX"))
          mp = output / "manifest.json"
          manifest = json.loads(mp.read_text())
          assert manifest.get("manifest_version") == 3
          manifest.pop("key", None)
          mp.write_text(json.dumps(manifest, indent=2) + "\n")
          for entry in [manifest.get("background", {}).get("service_worker"), manifest.get("action", {}).get("default_popup")]:
              if entry: assert (output / entry).is_file(), f"Missing referenced file: {entry}"
          for script in manifest.get("content_scripts", []):
              for entry in script.get("js", []): assert (output / entry).is_file(), f"Missing referenced file: {entry}"
          with ZipFile("VibeBridge-Chrome-Web-Store.zip", "w") as z:
              for path in output.rglob("*"):
                  if path.is_file():
                      z.write(path, path.relative_to(output).as_posix())
          with ZipFile("VibeBridge-Chrome-Web-Store.zip") as z:
              assert "manifest.json" in z.namelist()
              assert "key" not in json.loads(z.read("manifest.json"))
              print("Verified package; manifest.json is at archive root.")
          PY
      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeBridge-Chrome-Web-Store
          path: VibeBridge-Chrome-Web-Store.zip
          if-no-files-found: error
          retention-days: 7
