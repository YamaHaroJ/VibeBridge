name: Publish VibeBridge release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile agent/server.py agent/updater.py
          python3 -m json.tool extension/manifest.json >/dev/null
          bash -n agent/install.sh
          node --check extension/background.js
          node --check extension/chatgpt.js
          node --check extension/popup.js

      - name: Build Chrome extension package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vibebridge-out"
          mkdir -p "$OUT" "$RUNNER_TEMP/extension-zip"
          cp -R extension/. "$RUNNER_TEMP/extension-zip/"
          (cd "$RUNNER_TEMP/extension-zip" && zip -qr "$OUT/VibeBridge-Chrome-Extension.zip" .)
          (cd "$OUT" && shasum -a 256 "VibeBridge-Chrome-Extension.zip" > "SHA256SUMS.txt")

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/vibebridge-out/VibeBridge-Chrome-Extension.zip" \
            "$RUNNER_TEMP/vibebridge-out/SHA256SUMS.txt" \
            --title "VibeBridge $TAG" \
            --generate-notes
